name: Test suite worker

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite directory below test/cmake
        required: true
        type: string
      profiles:
        description: Space-separated profile list, or all
        required: false
        default: all
        type: string
      result_name:
        description: Unique suite or shard name used for artifacts
        required: true
        type: string
      checkout_ref:
        description: Git ref to check out; defaults to the triggering commit
        required: false
        default: ""
        type: string
      installer:
        description: Optional additional repository-local installer
        required: false
        default: ""
        type: string
      upload_coverage:
        description: Upload coverage reports produced by coverage profiles
        required: false
        default: true
        type: boolean
      install_timeout_minutes:
        description: Maximum dependency-install duration
        required: false
        default: 10
        type: number
      apt_cache:
        description: Keep the packages apt downloads in the Actions cache
        required: false
        default: true
        type: boolean
      test_timeout_minutes:
        description: Maximum test-step duration
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.result_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Validate worker request and wrappers
        env:
          INSTALLER: ${{ inputs.installer }}
          PROFILES: ${{ inputs.profiles }}
          RESULT_NAME: ${{ inputs.result_name }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [[ ! "${RESULT_NAME}" =~ ^[[:alnum:]_.-]+$ ]]; then
              echo "Invalid result name: ${RESULT_NAME}" >&2
              exit 2
          fi
          if [[ -n "${INSTALLER}" ]]; then
              if [[ ! "${INSTALLER}" =~ ^\./scripts/[[:alnum:]_.-]+\.sh$ ]] || [[ ! -x "${INSTALLER}" ]]; then
                  echo "Invalid installer: ${INSTALLER}" >&2
                  exit 2
              fi
          fi
          read -r -a requested_profiles <<< "${PROFILES}"
          RUN_CMAKE_SUITE_DRY_RUN=1 \
              ./scripts/run_cmake_suite.sh "${SUITE}" build "${requested_profiles[@]}"
          ./scripts/tests/profile_wrappers_test.sh

      # The key is the runner image and the install scripts, and a miss restores
      # the closest older cache. apt checks each cached .deb against the signed
      # index, so a restored file cannot change what is installed.
      - name: Prepare the apt cache key
        id: apt_key
        if: ${{ inputs.apt_cache }}
        env:
          INSTALLER: ${{ inputs.installer }}
        run: |
          set -euo pipefail
          scripts=(./scripts/install.sh)
          if [[ -n "${INSTALLER}" && "${INSTALLER}" != "./scripts/install.sh" ]]; then
              scripts+=("${INSTALLER}")
          fi
          echo "dir=${RUNNER_TEMP}/apt-archives" >> "${GITHUB_OUTPUT}"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "${GITHUB_OUTPUT}"
          echo "scripts=$(cat "${scripts[@]}" | sha256sum | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Restore the apt cache
        id: apt_restore
        if: ${{ inputs.apt_cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_key.outputs.dir }}
          key: apt-${{ steps.apt_key.outputs.image }}-${{ steps.apt_key.outputs.scripts }}
          restore-keys: |
            apt-${{ steps.apt_key.outputs.image }}-
            apt-

      # apt downloads as the unprivileged _apt user, which must own partial/.
      - name: Point apt at the cache
        if: ${{ inputs.apt_cache }}
        env:
          APT_DIR: ${{ steps.apt_key.outputs.dir }}
        run: |
          set -euo pipefail
          sudo mkdir -p "${APT_DIR}/partial"
          sudo chown _apt:root "${APT_DIR}/partial"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "${APT_DIR}" \
              | sudo tee /etc/apt/apt.conf.d/99-ci-archive-cache > /dev/null
          echo "apt cache: $(find "${APT_DIR}" -maxdepth 1 -name '*.deb' | wc -l) packages restored"

      - name: Install dependencies
        timeout-minutes: ${{ inputs.install_timeout_minutes }}
        env:
          INSTALLER: ${{ inputs.installer }}
        run: |
          set -euo pipefail
          ./scripts/install.sh
          if [[ -n "${INSTALLER}" && "${INSTALLER}" != "./scripts/install.sh" ]]; then
              "${INSTALLER}"
          fi

      # Saved straight after the install, so a run whose tests fail still keeps
      # it. autoclean drops packages the indexes no longer list; the root-only
      # lock and partial/ are removed so the unprivileged cache action can read
      # the rest.
      - name: Save the apt cache
        if: ${{ inputs.apt_cache && steps.apt_restore.outputs.cache-hit != 'true' }}
        env:
          APT_DIR: ${{ steps.apt_key.outputs.dir }}
        run: |
          set -euo pipefail
          sudo apt-get autoclean -qq
          sudo rm -rf "${APT_DIR}/partial" "${APT_DIR}/lock"
          sudo chmod -R a+rX "${APT_DIR}"
          echo "apt cache: $(find "${APT_DIR}" -maxdepth 1 -name '*.deb' | wc -l) packages, $(du -sh "${APT_DIR}" | cut -f1)"

      - name: Upload the apt cache
        if: ${{ inputs.apt_cache && steps.apt_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_key.outputs.dir }}
          key: apt-${{ steps.apt_key.outputs.image }}-${{ steps.apt_key.outputs.scripts }}

      - name: Report tool versions
        run: |
          set -euo pipefail
          gcc --version | sed -n '1p'
          test "$(gcc -dumpversion | cut -d. -f1)" = "14"
          gcovr --version | sed -n '1p'
          cmake --version | sed -n '1p'
          printf 'Ninja %s\n' "$(ninja --version)"
          openssl version -v
          bundled_tls_found=false
          while IFS= read -r bundled_openssl; do
              "${bundled_openssl}/bin/openssl" version -v
              bundled_tls_found=true
          done < <(find /opt/netxduo -maxdepth 1 -type d -name 'openssl-*' 2>/dev/null)
          while IFS= read -r bundled_wolfssl; do
              printf 'Bundled wolfSSL %s\n' "${bundled_wolfssl##*/wolfssl-}"
              bundled_tls_found=true
          done < <(find /opt/netxduo -maxdepth 1 -type d -name 'wolfssl-*' 2>/dev/null)
          if [[ "${bundled_tls_found}" = false ]]; then
              echo "Bundled OpenSSL and wolfSSL: not installed for this suite"
          fi

      - name: Build requested profiles
        timeout-minutes: 20
        env:
          PROFILES: ${{ inputs.profiles }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          read -r -a requested_profiles <<< "${PROFILES}"
          ./scripts/run_cmake_suite.sh "${SUITE}" build "${requested_profiles[@]}"

      - name: Test requested profiles
        timeout-minutes: ${{ inputs.test_timeout_minutes }}
        env:
          CTEST_REPEAT_FAIL: 2
          PROFILES: ${{ inputs.profiles }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          read -r -a requested_profiles <<< "${PROFILES}"
          ./scripts/run_cmake_suite.sh "${SUITE}" test "${requested_profiles[@]}"

      - name: Upload CTest results and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.result_name }}-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/cmake/${{ inputs.suite }}/build/**/*.xml
            test/cmake/${{ inputs.suite }}/build/**/*.txt
            test/cmake/${{ inputs.suite }}/build/**/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage reports
        if: ${{ always() && inputs.upload_coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.result_name }}-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/cmake/${{ inputs.suite }}/coverage_report
          if-no-files-found: ignore
          retention-days: 14
